# The cluster has one way in: Traefik, ingress class `internal` (192.168.0.20). LAN clients reach
# it directly; the public reaches it through the Cloudflare tunnel, whose public names are listed
# in the homelab repository (platform/cloudflared). TLS is the cluster's wildcard certificate,
# which also covers the apex.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: cuffney-com
spec:
  ingressClassName: internal
  rules:
    - host: cuffney.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: cuffney-com
                port:
                  name: http
    - host: www.cuffney.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: cuffney-com
                port:
                  name: http
