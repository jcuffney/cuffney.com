# Public via the Cloudflare tunnel: class `external` is the Traefik only the
# in-cluster cloudflared reaches; the target annotation makes external-dns
# create the Cloudflare CNAME for the apex.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: cuffney-com
  annotations:
    external-dns.alpha.kubernetes.io/target: "b9bb1ac7-14ac-49c0-94f5-b43418e1cf6c.cfargotunnel.com"
spec:
  ingressClassName: external
  rules:
    - host: cuffney.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: cuffney-com
                port:
                  name: http
    - host: www.cuffney.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: cuffney-com
                port:
                  name: http
