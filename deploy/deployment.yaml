# Stateless: an initContainer downloads the release tarball this repo's
# release.yml publishes (site.tar.gz on the rolling "latest" release) into an
# emptyDir, and nginx serves it. The v1 gateway pulled the same URL.
#
# Redeploying a new site build: push to main -> release.yml refreshes the
# "latest" asset -> `kubectl -n cuffney-com rollout restart deploy/cuffney-com`
# (or bump RELEASE_TAG below to a pinned tag and let Argo sync it).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cuffney-com
  labels:
    app.kubernetes.io/component: web
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: cuffney-com
      app.kubernetes.io/component: web
  template:
    metadata:
      labels:
        app.kubernetes.io/name: cuffney-com
        app.kubernetes.io/component: web
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
        fsGroup: 101
      initContainers:
        - name: fetch-site
          image: curlimages/curl:8.22.0
          env:
            # "latest" is the rolling release tag release.yml maintains; set a
            # real tag here to pin a build (the URL form is the same for both).
            - name: RELEASE_TAG
              value: latest
          command: ["/bin/sh", "-ec"]
          args:
            - |
              url="https://github.com/jcuffney/cuffney.com/releases/download/${RELEASE_TAG}/site.tar.gz"
              echo "fetching $url"
              curl -fsSL --retry 5 --retry-delay 5 -o /tmp/site.tar.gz "$url"
              tar -xzf /tmp/site.tar.gz -C /site
              test -f /site/index.html
              ls -la /site
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 200m
              memory: 64Mi
          volumeMounts:
            - name: site
              mountPath: /site
      containers:
        - name: nginx
          image: nginx:1.30.4-alpine
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 200m
              memory: 64Mi
          volumeMounts:
            - name: site
              mountPath: /usr/share/nginx/html
              readOnly: true
            - name: nginx-conf
              mountPath: /etc/nginx/conf.d
              readOnly: true
            - name: cache
              mountPath: /var/cache/nginx
            - name: run
              mountPath: /var/run
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 30
      volumes:
        - name: site
          emptyDir:
            sizeLimit: 64Mi
        - name: nginx-conf
          configMap:
            name: cuffney-com-nginx
        - name: cache
          emptyDir: {}
        - name: run
          emptyDir: {}
