server {
    listen 8080;
    server_name cuffney.com www.cuffney.com;
    root /usr/share/nginx/html;
    index index.html;

    location = /healthz {
        access_log off;
        return 200 "ok\n";
    }

    location ~* \.(?:css|js|woff2?|png|svg|ico)$ {
        add_header Cache-Control "public, max-age=604800, immutable";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
