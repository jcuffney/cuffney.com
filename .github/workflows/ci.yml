name: ci

# Tenant validation on GitHub-hosted runners (no LAN access needed):
# render deploy/ with kustomize and schema-check it with kubeconform.
# Argo CD deploys main on its own; nothing here talks to the cluster.

on:
  pull_request:
    paths: ["deploy/**", ".github/workflows/ci.yml"]
  push:
    branches: [main]
    paths: ["deploy/**", ".github/workflows/ci.yml"]

permissions:
  contents: read

env:
  KUSTOMIZE_VERSION: 5.7.1
  KUBECONFORM_VERSION: 0.7.0
  KUBERNETES_VERSION: 1.34.0

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install kustomize and kubeconform
        run: |
          set -euo pipefail
          curl -sSL "https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2Fv${KUSTOMIZE_VERSION}/kustomize_v${KUSTOMIZE_VERSION}_linux_amd64.tar.gz" | tar -xz -C /usr/local/bin kustomize
          curl -sSL "https://github.com/yannh/kubeconform/releases/download/v${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz" | tar -xz -C /usr/local/bin kubeconform

      - name: kustomize build
        run: kustomize build deploy/ > /tmp/rendered.yaml && wc -l /tmp/rendered.yaml

      - name: kubeconform
        run: |
          kubeconform -strict -summary \
            -kubernetes-version "${KUBERNETES_VERSION}" \
            -ignore-missing-schemas \
            -schema-location default \
            -schema-location 'https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json' \
            /tmp/rendered.yaml
